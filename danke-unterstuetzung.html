<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="/nc-theme.js"></script>
<script src="/site-edit.js"></script>
<script src="/nc-motion.js" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Danke – Newcall Apps</title>
<link rel="icon" href="icon.png">
<style>
@font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root { color-scheme: dark; --bg: #0b0b0c; --surface: #141416; --line: rgba(255,255,255,.09); --fg: #ededeb; --muted: #9a9a97; --dim: #6f6f6c; --pink: #ff5e8a; --green: #30d158;
  --display: "Geist", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
  color: var(--fg); font: 17px/1.5 var(--display); -webkit-font-smoothing: antialiased; padding: 24px 16px; }
main { max-width: 560px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 40px 28px; }
.heart { font-size: 56px; color: var(--pink); line-height: 1; }
h1 { font-size: clamp(32px, 6vw, 46px); letter-spacing: -0.02em; font-weight: 650; margin: 14px 0 0; }
p { color: var(--muted); margin: 14px 0 0; }
.fine { font-size: 13px; color: var(--dim); }
a.btn { display: inline-flex; margin-top: 26px; background: var(--fg); color: #000; text-decoration: none; font-weight: 600; border-radius: 10px; padding: 12px 20px; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }
html[data-theme="light"] a.btn { color: #fff; }
</style>
</head>
<body>
<main>
  <div class="heart" aria-hidden="true">♥</div>
  <h1>Danke dir!</h1>
  <p>Deine Unterstützung ist angekommen und fließt direkt in neue Funktionen und Updates für WinClean, Pebble und iDock.</p>
  <a class="btn" href="./#apps">Zurück zur Übersicht</a>
</main>
</body>
</html>
