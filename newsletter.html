<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="/site-edit.js"></script>
<script src="/nc-motion.js" defer></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Neuigkeiten – Newcall Apps</title>
<link rel="icon" href="icon.png">
<style>
@font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root { color-scheme: dark; --bg: #0b0b0c; --surface: #141416; --line: rgba(255,255,255,.09); --fg: #ededeb; --muted: #9a9a97; --dim: #6f6f6c; --blue: #0a84ff; --green: #30d158; --red: #ff6b61;
  --display: "Geist", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
  color: var(--fg); font: 17px/1.5 var(--display); -webkit-font-smoothing: antialiased; padding: 24px 16px; }
main { max-width: 560px; width: 100%; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 40px 28px; }
.icon { width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: rgba(10,132,255,.16); color: var(--blue); }
.icon.ok { background: rgba(48,209,88,.16); color: var(--green); }
.icon.bad { background: rgba(255,107,97,.16); color: var(--red); }
h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: -0.02em; font-weight: 650; margin: 16px 0 0; }
p { color: var(--muted); margin: 14px 0 0; }
.fine { font-size: 13px; color: var(--dim); }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
a.btn, button.btn { display: inline-flex; background: var(--fg); color: #000; border: 0; cursor: pointer; text-decoration: none; font: 600 16px var(--display); border-radius: 10px; padding: 12px 20px; }
.ghost { background: transparent !important; color: var(--fg) !important; border: 1px solid var(--line) !important; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="icon" id="icon" aria-hidden="true">…</div>
  <h1 id="title">Einen Moment …</h1>
  <p id="text">Wir prüfen deinen Link.</p>
  <div class="row">
    <a class="btn" href="./#apps">Zur Übersicht</a>
  </div>
  <p class="fine">Neuigkeiten kannst du auch im Newcall Launcher unter „Newcall-Konto“ an- und abschalten.</p>
</main>
<script>
(function () {
  var API = location.hostname === '127.0.0.1' ? 'http://127.0.0.1:8787/' : 'https://snafgyzhegwkxmunmxje.supabase.co/functions/v1/kehrwerk-license';
  var q = new URLSearchParams(location.search), a = q.get('a'), id = q.get('id') || '', t = q.get('t') || '';
  var $ = function (x) { return document.getElementById(x); };
  function show(kind, title, text) {
    $('icon').className = 'icon ' + kind; $('icon').textContent = kind === 'ok' ? '✓' : kind === 'bad' ? '!' : '✉';
    $('title').textContent = title; $('text').textContent = text;
  }
  function call(action) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action, id: id, t: t }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || j.error) throw new Error(j.error || 'Fehler ' + r.status); return j; }); });
  }
  function fail(e) { show('bad', 'Das hat nicht geklappt', (e && e.message === 'Failed to fetch') ? 'Keine Verbindung. Bitte versuche es gleich noch einmal.' : e.message); }
  if (a === 'confirm') {
    call('news_confirm').then(function (j) {
      show('ok', 'Danke, du bist dabei!', 'Ab jetzt bekommst du Neuigkeiten und Updates an ' + j.email + '. Abbestellen geht mit einem Klick unten in jeder E-Mail.');
    }).catch(fail);
  } else if (a === 'off') {
    call('news_off').then(function (j) {
      show('', 'Du bist abgemeldet', 'An ' + j.email + ' schicken wir keine Neuigkeiten mehr.');
    }).catch(fail);
  } else {
    show('bad', 'Der Link ist unvollständig', 'Bitte öffne den Link direkt aus der E-Mail.');
  }
})();
</script>
</body>
</html>
